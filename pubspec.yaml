name: adb_direct
description: >-
  A pure Dart ADB client for adbd on Android devices over the network:
  wireless debugging, shell, files, apps and more, without the adb binary.
version: 1.0.0
repository: https://github.com/dannyfwbb/adb_direct
issue_tracker: https://github.com/dannyfwbb/adb_direct/issues

topics:
  - adb
  - android
  - debugging
  - wireless-debugging

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

# Test-only key pairs (test/fixtures/README.md), not secrets.
false_secrets:
  - /test/fixtures/keys/adbkey
  - /test/fixtures/keys/adbkey_other
  - /test/fixtures/keys/adbkey_pkcs1.pem
  - /test/crypto/adb_key_pair_test.dart

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  collection: ^1.19.0
  crypto: ^3.0.6
  meta: ^1.16.0
  path: ^1.9.0
  pointycastle: '>=4.0.0 <4.1.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
