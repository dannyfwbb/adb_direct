name: adb_direct
description: >-
  A pure Dart ADB client that talks to adbd on Android devices over the
  network: authentication, wireless debugging, shell, files, apps and more,
  without the adb binary or an adb server.
version: 0.0.1-dev
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  collection: ^1.19.0
  crypto: ^3.0.6
  meta: ^1.16.0
  path: ^1.9.0
  pointycastle: '>=4.0.0 <4.1.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
