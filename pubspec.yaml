name: adb_direct
description: >-
  A pure Dart ADB client that talks to adbd on Android devices over the
  network: authentication, wireless debugging, shell, files, apps and more,
  without the adb binary or an adb server.
version: 0.0.1-dev
publish_to: none

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
